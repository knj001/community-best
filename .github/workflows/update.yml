name: Update community best digest

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 KST (다음날 기준)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 버튼도 생김

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape yesterday's posts
        run: python scraper.py --no-open

      - name: Build index.html
        run: python build_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html report_data.json
          git diff --staged --quiet || git commit -m "chore: daily digest update"
          git push
